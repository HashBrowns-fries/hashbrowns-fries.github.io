Canvas2Note 是 SJTU 全链路课程笔记自动化系统，实现从课程录像到结构化 Markdown 笔记的端到端流水线。系统通过 **Canvas API** 自动下载课件与录像，调度 **5 种 ASR 引擎**（FunASR SenseVoice · faster-whisper · Qwen3-ASR · SenseVoice-small · Whisper）进行语音转写，结合 **VLM（Qwen3-VL）** 对 PPT 截帧进行视觉分析，最终由 **LLM** 融合转写文本与视觉信息生成高质量 Markdown 笔记。支持直播实时转写、QR 签到监控，并提供 WebUI + CLI 双入口。

## 系统架构

Canvas2Note 采用 **FastAPI 后端 + React 前端** 分层架构。用户通过 WebUI 或 CLI 发起任务，FastAPI 调度下载、转写、分析、生成四个流水线阶段，通过 SSE 实时推送进度状态。

```mermaid
flowchart TB
    User["用户\nWebUI / CLI"]
    subgraph Frontend["React + Vite · 前端"]
        WebUI["WebUI\n课程浏览 · 任务管理"]
        Chat["AI 问答面板\n笔记交互"]
        Live["直播面板\n实时转写"]
    end
    subgraph Backend["FastAPI · 后端"]
        API["REST API\n任务调度 · SSE 推送"]
        Pipeline["Pipeline 引擎\n下载 · 转写 · 分析 · 生成"]
        Queue["任务队列\n并发控制"]
        DB["SQLite\ncourses · videos · notes"]
    end
    subgraph Services["外部服务 · 引擎层"]
        Canvas["Canvas LMS API\n课件 · 录像"]
        ASR["ASR 引擎\nFunASR · faster-whisper\nQwen3-ASR"]
        VLM["VLM\nQwen3-VL\nPPT 截帧分析"]
        LLM["LLM\n笔记融合生成"]
    end

    User --> Frontend
    WebUI --> |"HTTP / SSE"| API
    Chat --> |"HTTP"| API
    API --> Pipeline
    Pipeline --> Queue
    Queue --> DB
    Pipeline --> Canvas
    Pipeline --> ASR
    Pipeline --> VLM
    Pipeline --> LLM
```

## 核心特性

### 多引擎 ASR 转写

Canvas2Note 集成 5 种语音识别引擎，支持按精度、速度、硬件需求灵活选择：

| 引擎 | 框架 | 语言 | 硬件需求 | 特点 |
|------|------|------|---------|------|
| **FunASR SenseVoice** | FunASR | 中/英/日/韩 | GPU 推荐 | 高精度、情感识别、事件检测 |
| **faster-whisper** | CTranslate2 | 99 语言 | GPU/CPU | 4x 加速、低显存占用 |
| **Qwen3-ASR** | Qwen3 | 中/英 | GPU | 端到端大模型 ASR |
| **SenseVoice-small** | FunASR | 中/英 | CPU 友好 | 轻量推理、适合低配 |
| **Whisper** | OpenAI | 99 语言 | GPU | 原版 Whisper 基线 |

### VLM 视觉分析

利用 **Qwen3-VL** 多模态大模型对课件 PPT 进行逐帧视觉分析：

- **截帧提取** — FFmpeg 按关键帧变化自动截取 PPT 画面
- **内容识别** — 识别幻灯片中的文字、公式、图表、代码
- **结构理解** — 解析 PPT 的标题层级、要点列表、注释
- **图文对齐** — 将截帧内容与 ASR 时间戳对齐，形成图文并茂笔记

### LLM 融合生成

将 ASR 转写文本与 VLM 视觉分析结果送入 LLM，生成结构化 Markdown 笔记：

- **章节分割** — 基于 PPT 翻页事件自动划分章节
- **要点提炼** — 从口语化转写中提取核心知识点
- **公式还原** — 将口述公式转为 LaTeX 格式
- **补充注释** — 结合 PPT 视觉信息补全口语化省略内容

### 直播实时转写

支持课程直播的实时语音转写，通过 WebSocket 流式推送文本：

- **QR 签到监控** — 自动检测直播画面中的签到二维码，推送通知
- **实时字幕** — 低延迟语音转写，支持 FunASR 流式模式
- **自动录制** — 直播结束后自动触发完整笔记生成流水线

## 状态流转图

课程录像从入队到笔记生成完成的流水线状态生命周期，每个状态转换对应一个自动化处理步骤。

```mermaid
stateDiagram-v2
    [*] --> queued : 任务创建
    queued --> downloading : 开始下载
    downloading --> downloaded : 下载完成
    downloading --> error : 下载失败
    downloaded --> transcribing : 开始转写
    transcribing --> transcribed : 转写完成
    transcribing --> error : 转写失败
    transcribed --> analyzing : VLM 分析
    analyzing --> analyzed : 分析完成
    analyzing --> error : 分析失败
    analyzed --> generating : LLM 生成
    generating --> complete : 笔记生成
    generating --> error : 生成失败
    error --> queued : 重试
    complete --> [*]
```

## ASR 引擎对比

5 种 ASR 引擎的详细对比，帮助用户根据硬件条件和精度需求选择最优方案。

| 引擎 | 语言支持 | 推理速度 | 显存占用 | 适用场景 | 特色功能 |
|------|---------|---------|---------|---------|---------|
| **FunASR SenseVoice** | 中/英/日/韩 | 快 | 约 2 GB | 中文课程首选 | 情感识别、事件检测、标点恢复 |
| **faster-whisper** | 99 语言 | 4x Whisper | 约 1.5 GB | 多语言通用 | CTranslate2 优化、VAD 过滤 |
| **Qwen3-ASR** | 中/英 | 中等 | 约 4 GB | 大模型端到端 | 上下文理解、口语化规整 |
| **SenseVoice-small** | 中/英 | 很快 | 约 0.5 GB | CPU 低配环境 | 轻量模型、无需 GPU |
| **Whisper** | 99 语言 | 基线 | 约 3 GB | 多语言基线 | OpenAI 原版、生态丰富 |

## 技术栈

| 层级 | 技术 | 说明 |
|------|------|------|
| **前端** | React · Vite · Tailwind CSS | WebUI 界面，SSE 实时进度 |
| **后端** | FastAPI · Python | REST API、Pipeline 调度、SSE 推送 |
| **数据采集** | Canvas LMS API | 课程同步、录像下载、课件获取 |
| **语音转写** | FunASR · faster-whisper · Qwen3-ASR | 5 引擎可选，GPU/CPU 自适应 |
| **视觉分析** | Qwen3-VL · FFmpeg | PPT 截帧提取 + 多模态内容理解 |
| **笔记生成** | LLM (多模型) | ASR + VLM 融合生成结构化 Markdown |
| **数据库** | SQLite | courses, videos, transcriptions, notes |
| **直播** | WebSocket · FunASR Streaming | 实时转写、QR 签到监控 |
| **桌面端** | Tauri | 跨平台桌面应用打包 |

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#F3F0E8',
        primaryTextColor: '#1C1C18',
        primaryBorderColor: '#B4B0A8',
        lineColor: '#7A7870',
        secondaryColor: '#EDE9DF',
        tertiaryColor: '#F9F7F2',
        fontFamily: "'DM Mono', monospace",
        fontSize: '13px'
      }
    });

    async function renderPRD() {
      const md = document.getElementById('prd-content').textContent;
      const renderer = new marked.Renderer();
      const originalCode = renderer.code.bind(renderer);

      renderer.code = function({ text, lang }) {
        if (lang === 'mermaid') {
          return '<div class="mermaid">' + text + '</div>';
        }
        return '<pre><code>' + (text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
      };

      marked.setOptions({ renderer: renderer, breaks: false, gfm: true });
      document.getElementById('prd-rendered').innerHTML = marked.parse(md);

      await mermaid.run({ querySelector: '.mermaid' });
    }

    renderPRD();

    // ── Custom cursor (ring only, smooth follow) ─────────────
    const cursor = document.querySelector('.cursor');
    const lerp = (a, b, t) => a + (b - a) * t;
    let mouseX = -100, mouseY = -100;
    let curX = -100, curY = -100;
    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
    document.addEventListener('mouseenter', () => { cursor.style.opacity = '0.45'; });
    function animateCursor() {
      curX = lerp(curX, mouseX, 0.14);
      curY = lerp(curY, mouseY, 0.14);
      cursor.style.left = curX + 'px';
      cursor.style.top  = curY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
  </script>
