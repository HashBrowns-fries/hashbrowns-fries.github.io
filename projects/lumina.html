Lumina 是一款基于 **Tauri 2.0 + Rust** 构建的跨平台智能语言学习桌面应用。支持 **20+ 语言**词典查询，集成德语/梵语形态解析引擎、**SM-2 间隔重复**记忆算法，以及多 AI 后端（Gemini · DeepSeek · Qwen · Ollama）实现语法分析与上下文例句生成。前端采用 React + TypeScript，本地数据持久化基于 SQLite。

## 系统架构

Lumina 采用 **Tauri 2.0** 分层架构。React 前端通过 Tauri IPC 与 Rust 后端通信，Rust 层负责词典查询、形态分析、SRS 调度和数据持久化，外部 AI 服务提供语法解析与智能辅助。

```mermaid
flowchart TB
    User["用户交互\n输入单词 / 复习卡片"]
    subgraph Frontend["React + TypeScript · 前端"]
        UI["词典面板\n释义 · 例句 · 形态"]
        Review["复习模块\nSM-2 卡片 · 评分"]
        Settings["设置面板\n语言 · AI · 主题"]
    end
    subgraph Backend["Rust · Tauri 后端"]
        Dict["词典引擎\n20+ 语言查询"]
        Morph["形态分析\n德语变位 · 梵语词根"]
        SRS["SRS 调度器\nSM-2 算法"]
        DB["SQLite\nwords · vocabulary · reviews"]
    end
    subgraph Services["外部服务"]
        AI["AI 引擎\nGemini · DeepSeek\nQwen · Ollama"]
        DictAPI["词典 API\n在线词典源"]
    end

    User --> Frontend
    UI --> |"Tauri IPC"| Dict
    UI --> |"Tauri IPC"| Morph
    Review --> |"Tauri IPC"| SRS
    Dict --> DB
    Morph --> DB
    SRS --> DB
    Dict --> DictAPI
    Morph --> AI
    UI --> AI
```

## 核心特性

### 多语言词典引擎

Lumina 内置覆盖 20+ 语言的词典查询能力，支持离线与在线混合模式：

| 语言类别 | 支持语言 | 特性 |
|---------|---------|------|
| **欧洲语言** | 英语、德语、法语、西班牙语、意大利语、葡萄牙语等 | 释义、例句、发音 |
| **亚洲语言** | 中文、日语、韩语、越南语、泰语等 | Unicode 全覆盖 |
| **古典语言** | 梵语（Sanskrit）、拉丁语、古希腊语 | 词根分析、形态还原 |

### 形态分析引擎

针对形态丰富的语言提供深度解析：

- **德语** — 名词性数格（Genus/Numerus/Kasus）、动词变位（Konjugation）、形容词词尾
- **梵语** — Devanagari / IAST 转写、词根（Dhatu）还原、Sandhi 拆分、格变化（Vibhakti）
- **通用** — 词性标注（POS）、词频统计、词族关联

### SM-2 间隔重复系统

基于 SuperMemo SM-2 算法的智能复习调度，核心参数：

- **Ease Factor (EF)** — 每张卡片的难度系数，根据评分动态调整（最低 1.3）
- **Interval** — 复习间隔天数，按 EF 指数增长
- **评分等级** — 0（完全不记得）→ 5（完美回忆），低于 3 重新学习
- **批量复习** — 每日待复习队列，按到期时间排序

### 多 AI 引擎集成

支持灵活切换多种 AI 后端，提供语法解析、例句生成、上下文翻译等智能辅助：

| AI 引擎 | 类型 | 适用场景 |
|---------|------|---------|
| **Gemini** | Cloud API | 语法深度解析、长文翻译 |
| **DeepSeek** | Cloud API | 中文释义优化、例句生成 |
| **Qwen** | Cloud API | 多语言语法分析 |
| **Ollama** | 本地推理 | 离线场景、隐私敏感 |

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#F3F0E8',
        primaryTextColor: '#1C1C18',
        primaryBorderColor: '#B4B0A8',
        lineColor: '#7A7870',
        secondaryColor: '#EDE9DF',
        tertiaryColor: '#F9F7F2',
        fontFamily: "'DM Mono', monospace",
        fontSize: '13px'
      }
    });

    async function renderPRD() {
      const md = document.getElementById('prd-content').textContent;
      const renderer = new marked.Renderer();
      const originalCode = renderer.code.bind(renderer);

      renderer.code = function({ text, lang }) {
        if (lang === 'mermaid') {
          return '<div class="mermaid">' + text + '</div>';
        }
        return '<pre><code>' + (text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
      };

      marked.setOptions({ renderer: renderer, breaks: false, gfm: true });
      document.getElementById('prd-rendered').innerHTML = marked.parse(md);

      await mermaid.run({ querySelector: '.mermaid' });
    }

    renderPRD();

    // ── Custom cursor (ring only, smooth follow) ─────────────
    const cursor = document.querySelector('.cursor');
    const lerp = (a, b, t) => a + (b - a) * t;
    let mouseX = -100, mouseY = -100;
    let curX = -100, curY = -100;
    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
    document.addEventListener('mouseenter', () => { cursor.style.opacity = '0.45'; });
    function animateCursor() {
      curX = lerp(curX, mouseX, 0.14);
      curY = lerp(curY, mouseY, 0.14);
      cursor.style.left = curX + 'px';
      cursor.style.top  = curY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
  </script>
