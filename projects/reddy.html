Reddy 是一个面向小红书平台的垂直领域情报监控智能体，集成了 Auto OCR、Hermes ReAct Agent 和向量记忆检索系统。采用 **Node.js CLI（表现层）→ Python Agent（核心层）→ 外部服务（能力层）** 三层松耦合架构，通过 JSON-RPC 协议通信，内置 25 个工具模块。

## 系统架构

Reddy 采用清晰的三层架构设计。用户通过 Node.js CLI 输入自然语言或斜杠命令，CLI 层将请求通过 stdin/stdout JSON-RPC 传递给 Python Agent 核心层，Agent 执行 ReAct 推理循环后调度外部服务完成任务。

```mermaid
flowchart TB
    User["用户输入\n自然语言 / 斜杠命令"]
    subgraph CLI["Node.js CLI · 表现层"]
        Parse["命令解析\ncli.js → agent-loop.js"]
        Render["流式渲染\nThinking ◆ → Action ▶\n→ Observe ◀ → Answer ●"]
    end
    subgraph Agent["Python Agent · 核心层"]
        ReAct["ReAct 循环\nThinking → Action → Observe\n最大 10 轮"]
        Tools["ToolRegistry\n25 个工具"]
        Memory["MemoryManager\n向量记忆检索"]
        DB["SQLite\nposts · radars · tasks"]
    end
    subgraph Services["外部服务 · 能力层"]
        LLM["LLM 后端\nMiniMax API\nDeepSeek"]
        XHS["XHS Client\nAPI 优先 + CDP 回退\nxhshow 签名"]
        OCR["Umi-OCR\nPaddleOCR 引擎"]
    end

    User --> CLI
    Parse --> |"JSON-RPC\nstdin/stdout"| ReAct
    ReAct --> Tools
    ReAct --> Memory
    Tools --> DB
    ReAct --> Render
    Tools --> LLM
    Tools --> XHS
    Tools --> OCR
```

## 核心特性

### Hermes ReAct 循环

智能核心 `AIAgent` 实现了标准的 **ReAct (Reasoning + Acting)** 范式，支持两种运行模式：

| 模式 | 方法 | 工具调用方式 | 适用场景 |
|------|------|-------------|---------|
| **流式** | `run_stream()` | Anthropic 原生 `tool_use` | MiniMax API（兼容 Claude） |
| **非流式** | `run()` | 正则解析 `action:` / `参数:` | DeepSeek 等文本模型 |

流式模式通过回调 `on_event(type, data)` 实时推送阶段事件，Node.js 前端渲染为直观的状态指示：

- **\[Thinking\] ◆** — LLM 正在推理
- **\[Action\] ▶** — 解析并执行工具调用
- **\[Observe\] ◀** — 工具返回结果
- **\[Answer\] ●** — 生成最终回答

### JSON-RPC 通信协议

Node.js CLI 与 Python Backend 之间通过 **行分隔 JSON** 实现松耦合通信。Python 端将 `print()` 重定向到 stderr，保证 stdout 专用于 JSON-RPC，模块日志不会污染通信通道。

支持的命令：`init`（初始化）、`run`（执行对话）、`list_tools`（列出工具）、`dispatch`（直接调度）。

### Memory 向量检索系统

`MemoryManager` 提供可扩展的记忆架构，每次对话中记忆全程参与：

1. **Prefetch** — 用户输入 → 向量检索相关记忆 → 注入 System Prompt
2. **Sync** — LLM 输出后 → 自动提取可记忆信息 → 写入文件
3. **Session End** — 对话结束 → 持久化会话摘要

记忆存储在 `~/.reddy/memory/` 目录下，分为四类：用户偏好（user）、反馈规则（feedback）、项目上下文（project）、外部引用（reference）。

### XHS 数据获取（API 优先架构）

借鉴 MediaCrawler 的 **xhshow 纯算法签名** 方案，Reddy 的数据获取采用 **API 优先 + CDP 回退** 混合策略：

- **签名** — 纯 Python 算法生成 X-S / X-T / X-S-Common 请求头，无需浏览器执行 JS
- **Cookie** — Playwright 登录一次，Cookie 自动持久化，重启后保持登录态
- **API 优先** — 有 Cookie 时直接 httpx + 算法签名调用 REST API
- **CDP 回退** — API 触发验证码或 Cookie 过期时，自动回退到 Chrome CDP HTML 提取

## 核心流程图

ReAct（Reasoning + Acting）循环是 Reddy 的智能核心。每次用户输入后，Agent 进入最多 10 轮的推理-行动-观察循环，直至生成最终回答。

```mermaid
flowchart LR
    Input["用户输入"] --> Parse["意图解析"]
    Parse --> Think["Thinking ◆\nLLM 推理"]
    Think --> Action["Action ▶\n选择工具 + 参数"]
    Action --> Call["Tool Call\n执行工具"]
    Call --> Observe["Observe ◀\n获取结果"]
    Observe --> Judge{"是否足够\n回答？"}
    Judge -- "否（≤10轮）" --> Think
    Judge -- "是" --> Answer["Answer ●\n生成回答"]
```

  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#F3F0E8',
        primaryTextColor: '#1C1C18',
        primaryBorderColor: '#B4B0A8',
        lineColor: '#7A7870',
        secondaryColor: '#EDE9DF',
        tertiaryColor: '#F9F7F2',
        fontFamily: "'DM Mono', monospace",
        fontSize: '13px'
      }
    });

    async function renderPRD() {
      const md = document.getElementById('prd-content').textContent;
      const renderer = new marked.Renderer();
      const originalCode = renderer.code.bind(renderer);

      renderer.code = function({ text, lang }) {
        if (lang === 'mermaid') {
          return '<div class="mermaid">' + text + '</div>';
        }
        return '<pre><code>' + (text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
      };

      marked.setOptions({ renderer: renderer, breaks: false, gfm: true });
      document.getElementById('prd-rendered').innerHTML = marked.parse(md);

      await mermaid.run({ querySelector: '.mermaid' });
    }

    renderPRD();

    // ── Custom cursor (ring only, smooth follow) ─────────────
    const cursor = document.querySelector('.cursor');
    const lerp = (a, b, t) => a + (b - a) * t;
    let mouseX = -100, mouseY = -100;
    let curX = -100, curY = -100;
    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
    document.addEventListener('mouseenter', () => { cursor.style.opacity = '0.45'; });
    function animateCursor() {
      curX = lerp(curX, mouseX, 0.14);
      curY = lerp(curY, mouseY, 0.14);
      cursor.style.left = curX + 'px';
      cursor.style.top  = curY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
  </script>
